# ============================================================
#  RSLB 语言文件 (UTF-8)
#
#  颜色代码使用 '&' 前缀，例如 &a=绿色 &c=红色 &e=黄色 &b=天蓝
#  &l=加粗 &o=斜体 &n=下划线 &r=重置 &8=深灰
#  占位符使用 {名称} 形式，如 {name} {uuid} {count}
