command_message_link_to_desc: "&8[&b&lRSLB&8]&r&c迁移你当前账号的登录身份，以 &8(&e{redirect_name}&8)[&e{redirect_uuid}&8] &c的身份进入游戏"

# link to 后果（二次确认）
command_message_link_to_cq: "&8[&b&lRSLB&8]&r&c丢失现有档案的所有数据，并且无法回滚"

# 迁移请求已记录
command_message_link: "&8[&b&lRSLB&8]&r&6迁移请求已记录，现在请在目标账户下完整执行这条指令 &7/rsl link accept {self_online_name} &6以取得迁移码进行下一步迁移操作。本次迁移请求全程有效期为 &730 &6秒。"

# 迁移请求无效
command_message_accept_invalid: "&8[&b&lRSLB&8]&r&c迁移请求已失效或迁移请求正在进行或没有针对你正在使用的档案的迁移请求。"

# accept 描述（二次确认）
command_message_accept_desc: "&8[&b&lRSLB&8]&r&c同意对方迁移账户的请求，让使用 &e{target_service_name}&8(sid = &e{target_service_id}&8) &c登录的玩家 &8(&e{target_online_name}&8)[&e{target_online_uuid}&8] &c随时可以登录到你正在游玩的游戏档案 &8(&e{profile_name}&8)[&e{profile_uuid}&8] &c进行游戏"

# accept 后果（二次确认）
command_message_accept_cq: "&8[&b&lRSLB&8]&r&c不可预估的财产和名誉损失，除非对方也是你"

# 迁移验证码
command_message_accept: "&8[&b&lRSLB&8]&r&6本次迁移验证码为 &e{code}&6, 现在请在目标账户下完整执行这条指令 &7/rsl link code {profile_name} {code} &6以完成最终的迁移操作。"

# 迁移码无效
command_message_code_invalid: "&8[&b&lRSLB&8]&r&c迁移请求已失效或迁移请求正在进行或没有针对你的迁移请求。"

# 验证码错误
command_message_code_invalid_code: "&8[&b&lRSLB&8]&r&c验证码错误。"

# 迁移成功
command_message_code_succeed: "&8[&b&lRSLB&8]&r&a迁移成功，下次登录你将以 &8(&e{redirect_name}&8)[&e{redirect_uuid}&8] &a的身份进入游戏"

# 迁移成功（被踢玩家提示）
command_message_code_kickmessage: "&8[&b&lRSLB&8]&r&a迁移成功，下次登录你将以 &8(&e{redirect_name}&8)[&e{redirect_uuid}&8] &a的身份进入游戏"

