name: RSLB
version: '${version}'
main: com.rserene.chosen.server.RSLB
author: Chosen_1st
website: www.RSerene.com
api-version: '26.2'
folia-supported: true
load: POSTWORLD
commands:
  rslb:
    aliases: [rsl]
    description: "RSLB - 正版与 LittleSkin 登录"
    permission: command.rslb.base
permissions:
  command.rslb.base:
    description: "RSLB base command"
    default: true
  command.RSLB.tab.complete:
    description: "RSLB tab complete"
    default: true
  command.RSLB.reload:
    description: "RSLB reload"
    default: op
  command.RSLB.confirm:
    description: "RSLB confirm"
    default: true
  command.RSLB.eraseusername:
    description: "RSLB erase username"
    default: op
  command.RSLB.eraseallusernames:
    description: "RSLB erase all usernames"
    default: op
  command.RSLB.whitelist.add:
    description: "RSLB whitelist add"
    default: op
  command.RSLB.whitelist.remove:
    description: "RSLB whitelist remove"
    default: op
  command.RSLB.whitelist.specific.add:
    description: "RSLB whitelist specific add"
    default: op
  command.RSLB.whitelist.specific.remove:
    description: "RSLB whitelist specific remove"
    default: op
  command.RSLB.whitelist.list:
    description: "RSLB whitelist list"
    default: op
  command.RSLB.whitelist.list.verbose:
    description: "RSLB whitelist list verbose"
    default: op
  command.RSLB.rename.oneself:
    description: "RSLB rename oneself"
    default: op
  command.RSLB.rename.other:
    description: "RSLB rename other"
    default: op
  command.RSLB.current.oneself:
    description: "RSLB current oneself"
    default: op
  command.RSLB.current.other:
    description: "RSLB current other"
    default: op
  command.RSLB.profile.create:
    description: "RSLB profile create"
    default: op
  command.RSLB.profile.set.oneself:
    description: "RSLB profile set oneself"
    default: op
  command.RSLB.profile.set.other:
    description: "RSLB profile set other"
    default: op
  command.RSLB.profile.remove:
    description: "RSLB profile remove"
    default: op
  command.RSLB.list:
    description: "RSLB list"
    default: op
  command.RSLB.find.online:
    description: "RSLB find online"
    default: op
  command.RSLB.find.profile:
    description: "RSLB find profile"
    default: op
  command.RSLB.link.to:
    description: "RSLB link to"
    default: true
  command.RSLB.link.accept:
    description: "RSLB link accept"
    default: true
  command.RSLB.link.code:
    description: "RSLB link code"
    default: true
