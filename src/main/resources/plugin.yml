name: RSLB
version: '${version}'
main: com.rserene.chosen.server.RSLB
author: Chosen_1st
website: www.RSerene.com
api-version: '26.2'
folia-supported: true
commands:
  rslb:
    description: "RSLB 登录管理指令"
    usage: "/rslb help"
    permission: rslb.base
    permission-message: "&c你没有权限使用此指令。"
permissions:
  rslb.base:
    description: "rslb base command"
    default: true
  rslb.tab.complete:
    description: "rslb tab complete"
    default: true
  rslb.reload:
    description: "rslb reload"
    default: op
  rslb.confirm:
    description: "rslb confirm"
    default: true
  rslb.erase.username:
    description: "rslb erase username"
    default: op
  rslb.erase.all:
    description: "rslb erase all usernames"
    default: op
  rslb.whitelist.add:
    description: "rslb whitelist add"
    default: op
  rslb.whitelist.remove:
    description: "rslb whitelist remove"
    default: op
  rslb.whitelist.specific.add:
    description: "rslb whitelist specific add"
    default: op
  rslb.whitelist.specific.remove:
    description: "rslb whitelist specific remove"
    default: op
  rslb.whitelist.list:
    description: "rslb whitelist list"
    default: op
  rslb.whitelist.list.verbose:
    description: "rslb whitelist list verbose"
    default: op
  rslb.rename.oneself:
    description: "rslb rename oneself"
    default: op
  rslb.rename.other:
    description: "rslb rename other"
    default: op
  rslb.info.oneself:
    description: "rslb info oneself"
    default: op
  rslb.info.other:
    description: "rslb info other"
    default: op
  rslb.profile.create:
    description: "rslb profile create"
    default: op
  rslb.profile.set.oneself:
    description: "rslb profile set oneself"
    default: op
  rslb.profile.set.other:
    description: "rslb profile set other"
    default: op
  rslb.profile.remove:
    description: "rslb profile remove"
    default: op
  rslb.list:
    description: "rslb list"
    default: op
  rslb.find.online:
    description: "rslb find online"
    default: op
  rslb.find.profile:
    description: "rslb find profile"
    default: op
  rslb.link.to:
    description: "rslb link to"
    default: true
  rslb.link.accept:
    description: "rslb link accept"
    default: true
  rslb.link.code:
    description: "rslb link code"
    default: true
